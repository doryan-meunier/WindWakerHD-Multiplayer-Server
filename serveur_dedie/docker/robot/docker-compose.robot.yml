# Joueur robot, EXPÉRIMENTAL : à ajouter au serveur de serveur_dedie/docker (docs/hotes/ESSAYER_LE_ROBOT.md). Depuis le
# dépôt du MOD seulement (l'image du robot a besoin de tools/client, absent du dépôt généré du serveur).
#
#   cd serveur_dedie/docker
#   docker compose -f docker-compose.yml -f robot/docker-compose.robot.yml up -d --build
#   docker compose -f docker-compose.yml -f robot/docker-compose.robot.yml logs -f wwmp-robot
#   docker compose -f docker-compose.yml -f robot/docker-compose.robot.yml stop wwmp-robot      # le couper
#
# .env à côté de docker-compose.yml : WWMP_ROBOT_CLE (32 caractères hexadécimaux, la même pour les deux services ;
# « python3 -c "import secrets; print(secrets.token_hex(16))" »), WWMP_PORTAGE_LINUX (dossier de la release Linux
# du portage, préparée depuis TON dump sur cette machine). Puis, dans le lanceur : Administrer le serveur › Joueur
# robot › Automatique. Sans GPU : Mesa lavapipe (1 à 3 cœurs, 0,8 à 1,4 Go : voir l'étude §3).
services:
  wwmp:
    environment:
      WWMP_ROBOT_CLE: "${WWMP_ROBOT_CLE:?WWMP_ROBOT_CLE manquante dans .env}"
  wwmp-robot:
    build:
      context: ../..
      dockerfile: serveur_dedie/docker/robot/Dockerfile
    image: wwmp-robot
    container_name: wwmp-robot
    restart: unless-stopped
    depends_on:
      - wwmp
    environment:
      WWMP_ROBOT_CLE: "${WWMP_ROBOT_CLE:?WWMP_ROBOT_CLE manquante dans .env}"
    volumes:
      - "${WWMP_PORTAGE_LINUX:?WWMP_PORTAGE_LINUX manquant dans .env}:/portage"
      - wwmp-robot:/robot
    # le client lit et écrit la mémoire du jeu (/proc/<pid>/mem, même conteneur) : ptrace
    cap_add:
      - SYS_PTRACE
    mem_limit: 2g
    cpus: 3
    stop_grace_period: 15s

volumes:
  wwmp-robot:
