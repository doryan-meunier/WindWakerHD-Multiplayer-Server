# Écrit par outils/extraire_serveur.py (dépôt du mod) : ne pas modifier à la main.
# Construit l'image du serveur et la publie sur ghcr.io à chaque push sur main.
name: Image Docker du serveur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: serveur_dedie/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/doryan-meunier/windwakerhd-multiplayer-server:latest
            ghcr.io/doryan-meunier/windwakerhd-multiplayer-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/doryan-meunier/WindWakerHD-Multiplayer-Server
            org.opencontainers.image.description=Serveur de Wind Waker Coop (aucun fichier du jeu)
            org.opencontainers.image.licenses=MIT
