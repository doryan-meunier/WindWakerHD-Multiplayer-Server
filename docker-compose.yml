# Serveur Wind Waker Coop : le SEUL fichier à prendre (écrit par outils/extraire_serveur.py, ne pas modifier ici).
#
#   mkdir wwmp && cd wwmp
#   curl -fsSLO https://raw.githubusercontent.com/doryan-meunier/WindWakerHD-Multiplayer-Server/main/docker-compose.yml
#   docker compose up -d                  # télécharge l'image publiée et démarre (redémarre tout seul ensuite)
#   docker compose pull && docker compose up -d     # mettre à jour (le monde reste dans le volume)
#
# RIEN À ÉDITER ICI POUR JOUER : tout vit dans le volume wwmp-donnees (/donnees) : config.json (monde, randomizer,
# mode Hanteurs, joueurs max, deathlink, difficulté), mot_de_passe.txt, admin.txt, mondes/, cles.json, spoilers,
# mises_a_jour/. La configuration se règle depuis le lanceur : Héberger › « Sur mon serveur dédié » › « Administrer
# le serveur » (utilisateur + mot de passe admin, distincts du mot de passe de partie). Plus besoin de
# docker-compose.override.yml.
#
# Fichier .env facultatif à côté de ce fichier (modèle : serveur_dedie/docker/.env.exemple du dépôt) : WWMP_PORT (7777 par défaut),
# WWMP_ADMIN_UTILISATEUR / WWMP_ADMIN_MOT_DE_PASSE (compte admin ; sinon créé au hasard dans le volume),
# WWMP_MOT_DE_PASSE (mot de passe de partie au PREMIER démarrage seulement ; ensuite il se change dans le lanceur),
# WWMP_UID / WWMP_GID (utilisateur qui fait tourner le serveur, 10001 par défaut ; jamais root).
name: wwmp
services:
  wwmp:
    image: ghcr.io/doryan-meunier/windwakerhd-multiplayer-server:latest
    pull_policy: always   # « up -d » prend la dernière image publiée
    container_name: wwmp-serveur
    # utilisateur (UID:GID) qui fait tourner le serveur : défini ICI, pas dans l'image ; jamais root
    user: "${WWMP_UID:-10001}:${WWMP_GID:-10001}"
    # un redémarrage demandé depuis le lanceur arrête proprement le serveur : Docker le relance
    restart: unless-stopped
    ports:
      - "${WWMP_PORT:-7777}:7777/tcp"
    environment:
      WWMP_MOT_DE_PASSE: "${WWMP_MOT_DE_PASSE:-}"
      WWMP_ADMIN_UTILISATEUR: "${WWMP_ADMIN_UTILISATEUR:-}"
      WWMP_ADMIN_MOT_DE_PASSE: "${WWMP_ADMIN_MOT_DE_PASSE:-}"
    volumes:
      - wwmp-donnees:/donnees
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  wwmp-donnees:
